[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmbench"
version = "0.1.0"
description = "OpenAI互換APIで動くLLMの精度と速度を実測するベンチマークツール（CLI + GUI、依存パッケージ不要）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LLMBench" }]
keywords = ["llm", "benchmark", "openai-compatible", "accuracy", "throughput", "gui"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
llmbench = "llmbench.cli:main"

[project.gui-scripts]
llmbench-gui = "llmbench.gui:run_gui"

[tool.setuptools.packages.find]
include = ["llmbench*"]
